name: run-tests
on: [workflow_call]
jobs:
  run-tests:
    name: Run tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout and setup
        uses: actions/checkout@v6.0.1
        with:
          fetch-depth: 0
      - name: Setup Go
        uses: actions/setup-go@v7.0.0
      - name: Run tests
        run: |
          go test ./...
